<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Mega Raffle</title>
<style>
/* CSS Reset and Variables */
:root {
  --bg-color: #0f172a;
  --panel-bg: rgba(30, 41, 59, 0.7);
  --border-color: rgba(148, 163, 184, 0.2);
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --accent: #3b82f6;
  --accent-hover: #2563eb;
  --success: #10b981;
  --winner-gold: #fbbf24;
  --card-width: 250px;
  --card-margin: 10px;
  --total-card-width: calc(var(--card-width) + var(--card-margin) * 2);
}

body {
  margin: 0;
  padding: 0;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background-color: var(--bg-color);
  color: var(--text-main);
  overflow-x: hidden;
  display: flex;
  height: 100vh;
}

/* Layout */
.container {
  display: flex;
  width: 100%;
  height: 100%;
}

.sidebar {
  width: 350px;
  background: var(--panel-bg);
  border-right: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  padding: 20px;
  box-sizing: border-box;
  backdrop-filter: blur(10px);
  z-index: 20;
}

.main-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
  background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
}

/* Sidebar Elements */
h1 {
  font-size: 1.5rem;
  margin-top: 0;
  margin-bottom: 20px;
  text-align: center;
  color: var(--text-main);
  text-transform: uppercase;
  letter-spacing: 2px;
}

.control-group {
  margin-bottom: 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

label {
  font-size: 0.9rem;
  color: var(--text-muted);
}

textarea {
  width: 100%;
  height: 120px;
  background: rgba(15, 23, 42, 0.8);
  border: 1px solid var(--border-color);
  color: var(--text-main);
  padding: 10px;
  border-radius: 8px;
  resize: vertical;
  box-sizing: border-box;
  font-family: monospace;
}

button {
  background: var(--accent);
  color: white;
  border: none;
  padding: 12px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.2s;
  text-transform: uppercase;
  letter-spacing: 1px;
}

button:hover:not(:disabled) {
  background: var(--accent-hover);
  transform: translateY(-2px);
}

button:disabled {
  background: #475569;
  cursor: not-allowed;
  opacity: 0.7;
  transform: none;
}

.btn-secondary {
  background: transparent;
  border: 1px solid var(--accent);
  color: var(--accent);
}

.btn-secondary:hover:not(:disabled) {
  background: rgba(59, 130, 246, 0.1);
}

.btn-success {
  background: var(--success);
}
.btn-success:hover:not(:disabled) {
  background: #059669;
}

.checkbox-group {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
}

/* Stats */
.stats {
  background: rgba(15, 23, 42, 0.8);
  padding: 15px;
  border-radius: 8px;
  border: 1px solid var(--border-color);
  margin-bottom: 20px;
  text-align: center;
}
.stats .count {
  font-size: 2.5rem;
  font-weight: bold;
  color: var(--winner-gold);
  text-shadow: 0 0 10px rgba(251, 191, 36, 0.3);
}

/* Winners Table */
.winners-section {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.winners-list {
  flex: 1;
  overflow-y: auto;
  background: rgba(15, 23, 42, 0.8);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 10px;
  margin-bottom: 10px;
}

.winner-item {
  padding: 10px;
  border-bottom: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.winner-item:last-child {
  border-bottom: none;
}
.winner-name {
  font-weight: bold;
  font-size: 0.95rem;
}
.winner-meta {
  font-size: 0.8rem;
  color: var(--text-muted);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* Ticker Area */
.ticker-container {
  position: relative;
  width: 100%;
  height: 300px;
  margin: auto 0;
  display: flex;
  align-items: center;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0) 0%, rgba(30, 41, 59, 0.9) 50%, rgba(15, 23, 42, 0) 100%);
  border-top: 1px solid rgba(255,255,255,0.05);
  border-bottom: 1px solid rgba(255,255,255,0.05);
  overflow: hidden;
  box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
}

.ticker-track {
  display: flex;
  position: absolute;
  left: 50%;
  transform: translateX(0);
  will-change: transform;
}

/* Center Reticle */
.reticle {
  position: absolute;
  left: 50%;
  top: 0;
  bottom: 0;
  width: 4px;
  background: var(--winner-gold);
  transform: translateX(-50%);
  z-index: 10;
  box-shadow: 0 0 15px var(--winner-gold), 0 0 5px var(--winner-gold);
}

.reticle::before, .reticle::after {
  content: '';
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  border: 15px solid transparent;
}

.reticle::before {
  top: 0;
  border-top-color: var(--winner-gold);
}

.reticle::after {
  bottom: 0;
  border-bottom-color: var(--winner-gold);
}

/* Card */
.card {
  width: var(--card-width);
  height: 180px;
  margin: 0 var(--card-margin);
  background: rgba(15, 23, 42, 0.9);
  border: 2px solid var(--border-color);
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 20px;
  box-sizing: border-box;
  text-align: center;
  flex-shrink: 0;
  transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
  box-shadow: 0 10px 25px rgba(0,0,0,0.4);
  position: relative;
  overflow: hidden;
}

.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; height: 4px;
  background: var(--accent);
}

.card .name {
  font-size: 1.25rem;
  font-weight: 700;
  margin-bottom: 12px;
  color: var(--text-main);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  width: 100%;
}

.card .dept {
  font-size: 0.85rem;
  padding: 6px 12px;
  border-radius: 20px;
  margin-bottom: 12px;
  font-weight: 600;
  background: rgba(255,255,255,0.1);
}


.card.winner {
  border-color: var(--winner-gold);
  box-shadow: 0 0 40px rgba(251, 191, 36, 0.4);
  transform: scale(1.08);
  z-index: 5;
  background: rgba(30, 41, 59, 1);
}
.card.winner::before {
  background: var(--winner-gold);
}

/* Confetti */
#confetti-canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  z-index: 9999;
}

/* Modal */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(8px);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease;
}

.modal-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

.modal {
  background: linear-gradient(145deg, var(--panel-bg), #0f172a);
  border: 2px solid var(--winner-gold);
  border-radius: 20px;
  padding: 50px;
  text-align: center;
  max-width: 500px;
  width: 90%;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 80px rgba(251, 191, 36, 0.15);
  transform: scale(0.85) translateY(20px);
  transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.modal-overlay.active .modal {
  transform: scale(1) translateY(0);
}

.modal h2 {
  color: var(--winner-gold);
  font-size: 3rem;
  margin-top: 0;
  margin-bottom: 10px;
  text-transform: uppercase;
  text-shadow: 0 0 20px rgba(251, 191, 36, 0.4);
}

.modal .winner-details {
  margin: 40px 0;
}
.modal .winner-name {
  font-size: 2.5rem;
  font-weight: 800;
  margin-bottom: 15px;
}
.modal .winner-dept {
  font-size: 1.1rem;
  display: inline-block;
  padding: 8px 20px;
  border-radius: 30px;
  background: rgba(255,255,255,0.1);
  margin-bottom: 15px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.modal button {
  width: 100%;
  font-size: 1.2rem;
  padding: 15px;
  background: var(--winner-gold);
  color: #000;
}
.modal button:hover {
  background: #f59e0b;
}

/* Audio Toggle */
.audio-toggle {
  position: absolute;
  top: 20px;
  right: 20px;
  z-index: 50;
}
.audio-toggle button {
  background: var(--panel-bg);
  border: 1px solid var(--border-color);
  padding: 10px;
  border-radius: 50%;
  width: 50px;
  height: 50px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 1.2rem;
  backdrop-filter: blur(5px);
}
.audio-toggle button:hover {
  background: rgba(255,255,255,0.1);

/* Department Colors */
.dept-administration { background-color: rgba(59, 130, 246, 0.15); color: #93c5fd; border: 1px solid rgba(59, 130, 246, 0.4); }

.dept-it { background-color: rgba(139, 92, 246, 0.15); color: #c4b5fd; border: 1px solid rgba(139, 92, 246, 0.4); }
.dept-treasury { background-color: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); }
.dept-default { background-color: rgba(148, 163, 184, 0.15); color: #e2e8f0; border: 1px solid rgba(148, 163, 184, 0.4); }

/* Scrollbar styling */
::-webkit-scrollbar {
  width: 6px;
}
::-webkit-scrollbar-track {
  background: rgba(0,0,0,0.2);

::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.2); 
  border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
  background: rgba(255,255,255,0.3);

// Audio Context (Web Audio API)
let audioCtx = null;
function playTick(frequency = 800, type = 'sine', duration = 0.05, vol = 0.3) {
  if (!audioEnabled) return;
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  
  osc.type = type;
  osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(frequency / 2, audioCtx.currentTime + duration);
  
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
  
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

// Confetti System
const ctx = DOM.confettiCanvas.getContext('2d');
let particles = [];
let confettiAnimationId = null;

function resizeCanvas() {
  DOM.confettiCanvas.width = window.innerWidth;
  DOM.confettiCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function createConfetti() {
  particles = [];
  const colors = ['#fbbf24', '#3b82f6', '#10b981', '#f472b6', '#f8fafc', '#a855f7'];
  for (let i = 0; i < 200; i++) {
    particles.push({
      x: Math.random() * DOM.confettiCanvas.width,
      y: Math.random() * DOM.confettiCanvas.height - DOM.confettiCanvas.height,
      r: Math.random() * 6 + 3,
      dx: Math.random() * 4 - 2,
      dy: Math.random() * 5 + 3,
      color: colors[Math.floor(Math.random() * colors.length)],
      tilt: Math.random() * 10
    });
  }
}

function drawConfetti() {
  ctx.clearRect(0, 0, DOM.confettiCanvas.width, DOM.confettiCanvas.height);
  particles.forEach((p, index) => {
    p.y += p.dy;
    p.x += p.dx;
    p.tilt += 0.1;
    
    ctx.beginPath();
    ctx.lineWidth = p.r;
    ctx.strokeStyle = p.color;
    ctx.moveTo(p.x + p.tilt + p.r, p.y);
    ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r);
    ctx.stroke();
    
    // Reset particle at top if it goes off screen
    if (p.y > DOM.confettiCanvas.height) {
      particles[index] = { ...p, y: -20, x: Math.random() * DOM.confettiCanvas.width };
    }
  });
  confettiAnimationId = requestAnimationFrame(drawConfetti);
}

function stopConfetti() {
  cancelAnimationFrame(confettiAnimationId);
  ctx.clearRect(0, 0, DOM.confettiCanvas.width, DOM.confettiCanvas.height);
}


// Utility Functions
function getDeptClass(deptName) {
  const normalized = deptName.toLowerCase().replace(/[^a-z0-9]/g, '-');
  if (normalized.includes('admin')) return 'dept-administration';
  if (normalized.includes('public') || normalized.includes('work')) return 'dept-public-works';
  if (normalized.includes('health') || normalized.includes('medic')) return 'dept-health';
  if (normalized.includes('social') || normalized.includes('welfare')) return 'dept-social-welfare';
  if (normalized.includes('it') || normalized.includes('info') || normalized.includes('tech')) return 'dept-it';
  if (normalized.includes('treasury') || normalized.includes('finance')) return 'dept-treasury';
  return 'dept-default';
}

function parseInput() {
  const text = DOM.dataInput.value.trim();
  if(!text) return;
  const lines = text.split('\n');
  pool = [];
  lines.forEach(line => {
    // split by comma or tab
    const parts = line.split(/[,;\t]/).map(s => s.trim());
    if (parts.length >= 1 && parts[0]) {
      pool.push({
        id: Math.random().toString(36).substr(2, 9),
        name: parts[0] || 'Unknown',
        dept: parts[parts.length - 1] || 'General'
      });
    }
  });
  updatePoolCount();
  if (pool.length > 0) {
    DOM.btnSpin.disabled = false;
    setupInitialTicker();
  }
}

function updatePoolCount() {
  DOM.poolCount.textContent = pool.length;
}

function createCardHTML(entry, isWinnerPlaceholder = false) {
  const deptClass = getDeptClass(entry.dept);
  return `
    <div class="card ${isWinnerPlaceholder ? 'winner-placeholder' : ''}" data-id="${entry.id}">
      <div class="name" title="${entry.name}">${entry.name}</div>
      <div class="dept ${deptClass}">${entry.dept}</div>
    </div>
  `;
}

function setupInitialTicker() {
  let html = '';
  // Show random preview
  for(let i=0; i<Math.min(30, pool.length); i++) {
    const item = pool[Math.floor(Math.random() * pool.length)];
    html += createCardHTML(item);
  }
  DOM.tickerTrack.innerHTML = html;
  DOM.tickerTrack.style.transform = `translateX(0px)`;
  currentTransformX = 0;
}

// Tick Audio simulation during spin
function simulateTicks() {
  const cardWidthWithMargin = 270; // 250 + 10*2
  let lastX = 0;
  
  function checkTick() {
    if(!isSpinning) return;
    
    // Read the live computed transform matrix
    const style = window.getComputedStyle(DOM.tickerTrack);
    const matrix = new DOMMatrixReadOnly(style.transform);
    const currentX = Math.abs(matrix.m41);
    
    // If we've crossed a card threshold boundary
    if (Math.floor(currentX / cardWidthWithMargin) > Math.floor(lastX / cardWidthWithMargin)) {
      playTick(500 + Math.random()*100, 'square', 0.03, 0.15);
    }
    
    lastX = currentX;
    if (isSpinning) {
      requestAnimationFrame(checkTick);
    }
  }
  
  requestAnimationFrame(checkTick);
}

function spin() {
  if (pool.length === 0 || isSpinning) return;
  isSpinning = true;
  DOM.btnSpin.disabled = true;
  DOM.btnImport.disabled = true;
  DOM.btnLoadSample.disabled = true;
  
  // 1. Pick a winner
  const winnerIndex = Math.floor(Math.random() * pool.length);
  const winner = pool[winnerIndex];
  
  // 2. Build the strip
  // Ensure the strip contains every participant at least once so it genuinely goes through all.
  let strip = [];
  let shuffled = [...pool].sort(() => Math.random() - 0.5);
  
  // We want a minimum strip length for the animation, but we also want all participants included.
  while (strip.length < 70 || strip.length < pool.length) {
    strip.push(...shuffled);
    shuffled = [...pool].sort(() => Math.random() - 0.5); // reshuffle for next batch if needed
  }
  
  // Cap at a reasonable DOM limit to prevent browser crash if pool is massive.
  if (strip.length > 2000) {
    strip = strip.slice(0, 2000);
  }
  
  // Place the winner near the end of the strip
  const WINNER_POS = strip.length - Math.min(10, Math.floor(strip.length / 4));
  strip[WINNER_POS] = winner;
  
  // Reset track to starting position instantly without transition
  DOM.tickerTrack.style.transition = 'none';
  DOM.tickerTrack.style.transform = 'translateX(0px)';
  
  let html = '';
  strip.forEach((item, idx) => {
    html += createCardHTML(item, idx === WINNER_POS);
  });
  DOM.tickerTrack.innerHTML = html;
  
  // 3. Calculate Target Position
  const cardWidth = 250;
  const cardMargin = 10;
  const totalCardWidth = cardWidth + cardMargin * 2; // 270
  
  // Distance to shift so the card's center aligns with the reticle
  // Since the track starts at left: 50%, we just shift left by the card's center position.
  const offsetToCenterCard = totalCardWidth / 2;
  
  // Add a random offset so it doesn't land perfectly dead center every time
  // Bounds: -90px to +90px within the 250px card width
  const randomOffset = (Math.random() * 180) - 90;
  
  const targetX = -(WINNER_POS * totalCardWidth) - offsetToCenterCard - randomOffset;
  
  // Force a browser reflow so the 'none' transition applies instantly
  DOM.tickerTrack.offsetHeight; 
  
  // 4. Start Animation
  const durInput = parseFloat(document.getElementById('spin-duration').value);
  const spinDuration = isNaN(durInput) || durInput <= 0 ? 5500 : durInput * 1000;
  DOM.tickerTrack.style.transition = `transform ${spinDuration}ms cubic-bezier(0.12, 0.8, 0.2, 1)`;
  DOM.tickerTrack.style.transform = `translateX(${targetX}px)`;
  currentTransformX = targetX;
  
  // 5. Start audio ticking
  simulateTicks();
  
  // 6. Handle End of Spin
  setTimeout(() => {
    isSpinning = false;
    
    // Visually highlight the winner card in the DOM
    const cards = DOM.tickerTrack.querySelectorAll('.card');
    const winnerCard = cards[WINNER_POS];
    if (winnerCard) {
      winnerCard.classList.add('winner');
    }
    
    // Play celebratory sound
    playTick(800, 'sine', 0.1, 0.5);
    setTimeout(() => playTick(1200, 'sine', 0.4, 0.5), 150);
    
    // Launch Modal and Confetti
    showWinner(winner);
    
    // Remove winner from pool if checked
    if (DOM.chkRemoveWinner.checked) {
      pool.splice(winnerIndex, 1);
      updatePoolCount();
    }
    
    // Re-enable controls
    if (pool.length > 0) DOM.btnSpin.disabled = false;
    DOM.btnImport.disabled = false;
    DOM.btnLoadSample.disabled = false;
    
  }, spinDuration + 150); // slight delay to ensure CSS transition completes
}

function showWinner(winner) {
  // Log the winner
  const timestamp = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
  winners.push({ ...winner, timestamp });
  renderWinners();
  
  // Populate Modal
  DOM.modalName.textContent = winner.name;
  DOM.modalDept.textContent = winner.dept;
  DOM.modalDept.className = 'winner-dept ' + getDeptClass(winner.dept);
  
  // Launch celebration
  createConfetti();
  drawConfetti();
  DOM.winnerModal.classList.add('active');
}

function renderWinners() {
  DOM.winnersList.innerHTML = '';
  // Render in reverse chronological order
  [...winners].reverse().forEach(w => {
    const el = document.createElement('div');
    el.className = 'winner-item';
    el.innerHTML = `
      <div class="winner-name">${w.name}</div>
      <div class="winner-meta">
        <span class="${getDeptClass(w.dept)}" style="padding: 2px 8px; border-radius: 4px; font-size:0.7rem; font-weight: 600;">${w.dept}</span>
        <span>${w.timestamp}</span>
      </div>
    `;
    DOM.winnersList.appendChild(el);
  });
  DOM.btnExportWinners.disabled = winners.length === 0;
}

function exportWinners() {
  if (winners.length === 0) return;
  let csv = "Name,Department,Time\n";
  winners.forEach(w => {
    csv += `"${w.name}","${w.dept}","${w.timestamp}"\n`;
  });
  
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.setAttribute('download', `raffle_winners_${new Date().toISOString().slice(0,10)}.csv`);
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

// Event Listeners
DOM.btnLoadSample.addEventListener('click', generateSampleData);
DOM.btnImport.addEventListener('click', parseInput);
DOM.btnSpin.addEventListener('click', spin);
DOM.btnCloseModal.addEventListener('click', () => {
  DOM.winnerModal.classList.remove('active');
  stopConfetti();
});
DOM.btnExportWinners.addEventListener('click', exportWinners);

DOM.btnAudio.addEventListener('click', () => {
  audioEnabled = !audioEnabled;
  DOM.btnAudio.textContent = audioEnabled ? '🔊' : '🔇';
  // Resume context if user enables it after loading
  if(audioEnabled && audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
});
